text_sensor:
  - platform: template
    id: hub_state
    name: "${t_hub_state}"
    icon: mdi:access-point-network
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: grp_dbg
  - platform: template
    id: boot_hist
    name: "${t_boots}"
    icon: mdi:restart
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: grp_dbg
  - platform: template
    id: fw_ver
    name: "${t_fw}"
    icon: mdi:chip
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: grp_values
      sorting_weight: 99
  - platform: template
    id: last_report
    name: "${t_last_report}"
    icon: mdi:clock-check-outline
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      time_t now = ::time(nullptr);
      if (now < 1700000000) return {std::string("?")};
      char b[32];
      struct tm tmv;
      localtime_r(&now, &tmv);
      strftime(b, sizeof(b), "%Y-%m-%d %H:%M", &tmv);
      return {std::string(b)};
    web_server:
      sorting_group_id: grp_values
  - platform: wifi_info
    ip_address:
      name: "${t_ip}"
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_wifi
    ssid:
      name: "${t_wifi_cur}"
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_wifi

interval:
  - interval: 10s
    then:
      - if:
          condition:
            lambda: 'return id(g_service);'
          then:
            - if:
                condition: wifi.connected
                then:
                  - logger.log:
                      format: "STATUS: service mode, WiFi OK, MQTT %s, log %u records"
                      args: ['id(mqtt_client).is_connected() ? "OK" : "not connected"', '(unsigned) plog::size()']
                else:
                  - logger.log: "STATUS: service mode, WiFi not connected (setup WiFi active?)"
            - script.execute: do_measure
            - script.execute: show_code
            - script.execute: read_extra
            - script.execute: publish_all
            - if:                  # safety timeout back to normal mode
                condition:
                  lambda: |-
                    return millis() - id(g_service_t0) > (uint32_t) (id(service_timeout).state * 60000.0f);
                then:
                  - script.execute: service_off

script:
  # ---------------------------------------------------------------- what to do after a wake
  - id: wake_flow
    then:
      - lambda: |-
          // web page login from the settings (else the defaults from secrets.yaml)
          if (!id(web_user).state.empty() && !id(web_pass).state.empty()) {
            plog::web_user_s = id(web_user).state;
            plog::web_pass_s = id(web_pass).state;
            web_server_base::global_web_server_base->set_auth_username(plog::web_user_s.c_str());
            web_server_base::global_web_server_base->set_auth_password(plog::web_pass_s.c_str());
          }
      - if:
          condition:               # not set up yet (first start / network reset), after power off or after an update
            lambda: 'return !id(g_setup_done) || (id(g_start_service) && !id(g_timer_wake));'
          then:
            - lambda: 'id(g_start_service) = false;'
            - script.execute: service_on
          else:
            - if:
                condition:
                  lambda: 'return id(g_timer_wake);'
                then:              # ---- timer wake: log, send to the hub, report only every Nth time
                  - script.execute: log_reading
                  - script.execute: hub_sync
                  - script.wait: hub_sync
                  - if:
                      condition:
                        lambda: |-
                          float r = id(report_every).state;
                          int n = (std::isnan(r) || r < 1.0f) ? 6 : (int) r;
                          return (plog::rtc_wakes % n) == 0 && id(g_wifi_ok) && !id(g_hub_ok);   // the hub forwards to MQTT
                      then:
                        - script.execute: radio_wifi
                        - wait_until:
                            condition:
                              lambda: 'return id(mqtt_host).state.empty() || id(mqtt_client).is_connected();'
                            timeout: 20s
                        - delay: 1s        # let the connection settle (discovery, subscriptions)
                        - script.execute: read_extra
                        - script.wait: read_extra
                        - script.execute: publish_all
                        - script.execute: send_report   # waits for the broker's echo (max ~12 s)
                        - script.wait: send_report
                        - delay: 300ms
                  - script.execute: go_to_sleep
                else:              # ---- RST button / power-on: blink code, hub, then (no hub) report + BLE window
                  - script.execute: show_code
                  - script.execute: log_reading
                  - script.execute: hub_sync
                  - script.wait: hub_sync
                  - if:
                      condition:
                        lambda: 'return id(g_hub_ok);'
                      then:        # the hub took the readings: no WiFi, no Bluetooth (phone talks to the hub)
                        - script.wait: show_code
                        - delay: 500ms
                        - output.turn_on: status_led   # one 1 s glow AFTER the code = delivered to the hub
                        - delay: 1s                    # (low battery glows BEFORE the code)
                        - output.turn_off: status_led
                        - delay: 3s        # time to start a BOOT long press (service mode / power off)
                        - wait_until:
                            condition:
                              binary_sensor.is_off: boot_button
                            timeout: 15s
                        - script.wait: btn_hold
                        - delay: 300ms
                        - if:
                            condition:
                              lambda: 'return !id(g_service);'
                            then:
                              - script.execute: go_to_sleep
                      else:
                        - script.execute: ble_on
                        - if:
                            condition:
                              lambda: 'return id(g_wifi_ok) || !id(mqtt_host).state.empty();'
                            then:
                              - script.execute: radio_wifi
                              - wait_until:
                                  condition:
                                    lambda: 'return id(mqtt_host).state.empty() || id(mqtt_client).is_connected();'
                                  timeout: 20s
                        - delay: 1s
                        - script.execute: read_extra
                        - script.wait: read_extra
                        - script.execute: publish_all
                        - script.execute: send_report
                        - script.wait: send_report
                        - script.wait: show_code
                        - wait_until:      # 2 min for the phone page / BOOT long press
                            condition:
                              lambda: 'return id(g_service) || (id(g_ble_clients) > 0);'
                            timeout: 120s
                        - wait_until:      # stay awake while a phone is connected (max 5 min)
                            condition:
                              lambda: 'return id(g_service) || id(g_ble_clients) == 0;'
                            timeout: 300s
                        - wait_until:
                            condition:
                              binary_sensor.is_off: boot_button
                            timeout: 15s
                        - script.wait: btn_hold
                        - delay: 300ms
                        - if:
                            condition:
                              lambda: 'return !id(g_service);'
                            then:
                              - script.execute: go_to_sleep

  # ---------------------------------------------------------------- hub (ESP-NOW)
  - id: hub_sync
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(hub_enable).state && !id(g_service);'
          then:
            - lambda: |-
                pnet::Probe &p = pnet::P;
                p.c = id(espnow_c);
                for (int i = 0; i < 6; i++) p.hub[i] = (uint8_t) (id(g_hub_mac) >> (8 * (5 - i)));
                p.ch = id(g_hub_ch) ? id(g_hub_ch) : 1;
                p.cfg_ver = id(g_cfg_ver);
                p.unsent = id(g_unsent);
                p.fails = id(g_hub_fail);
                // look for the hub on all channels: not paired yet or 3 wakes without an answer;
                // on timer wakes only every 6th time (scanning costs ~1 s of radio)
                p.allow_scan = (!pnet::hub_known() || p.fails >= 3) && (!id(g_timer_wake) || (plog::rtc_wakes % 6) == 0);
                pnet::DataHdr &h = p.cur;
                memset(&h, 0, sizeof(h));
                h.vbat_mv = (uint16_t) lroundf(id(g_vbat) * 1000.0f);
                h.moist10 = (uint16_t) lroundf(id(g_moist) * 10.0f);
                h.raw_mv = (uint16_t) lroundf(id(g_raw) * 1000.0f);
                h.li = (uint16_t) id(log_interval).state;
                h.dry_mv = (uint16_t) lroundf(id(cal_dry).state * 1000.0f);
                h.wet_mv = (uint16_t) lroundf(id(cal_wet).state * 1000.0f);
                h.re = (uint8_t) id(report_every).state;
                h.st = (uint8_t) id(service_timeout).state;
                memcpy(h.fw, "${fw_short}\0\0\0\0\0\0\0\0", sizeof(h.fw));
                p.phase = 0;
                p.result = "no hub";
                if (pnet::hub_known() || p.allow_scan) {   // radio on only when there is something to do
                  id(espnow_c).enable();
                  pnet::start();
                }
            - while:
                condition:
                  lambda: 'return pnet::step();'
                then:
                  - delay: 5ms
            - lambda: |-
                pnet::Probe &p = pnet::P;
                uint64_t mac = 0;
                for (int i = 0; i < 6; i++) mac = (mac << 8) | p.hub[i];
                id(g_hub_mac) = mac;
                id(g_hub_ch) = p.ch;
                id(g_hub_fail) = p.fails;
                id(g_unsent) = p.unsent;
                id(g_hub_rssi) = p.rssi;
                id(g_hub_ok) = p.delivered > 0 || strcmp(p.result, "ok") == 0;
                ESP_LOGI("hub", "%s: %u readings delivered, %u waiting, channel %u, rssi %d",
                         p.result, (unsigned) p.delivered, (unsigned) p.unsent, p.ch, p.rssi);
                if (p.settings_rx) {                     // new settings sent by the hub
                  const pnet::Ack &s = p.settings;
                  if (s.li) { auto c = id(log_interval).make_call(); c.set_value(s.li); c.perform(); }
                  if (s.re) { auto c = id(report_every).make_call(); c.set_value(s.re); c.perform(); }
                  if (s.st) { auto c = id(service_timeout).make_call(); c.set_value(s.st); c.perform(); }
                  if (s.dry_mv) { auto c = id(cal_dry).make_call(); c.set_value(s.dry_mv / 1000.0f); c.perform(); }
                  if (s.wet_mv) { auto c = id(cal_wet).make_call(); c.set_value(s.wet_mv / 1000.0f); c.perform(); }
                  if (s.cmd & pnet::CMD_CLEAR_LOG) { plog::clear(); id(g_unsent) = 0; }
                  id(g_cfg_ver) = s.cfg_ver;
                  ESP_LOGI("hub", "new settings %u applied", s.cfg_ver);
                }
                if (!id(espnow_c).is_disabled()) {
                  id(espnow_c).disable();
                  if (wifi::global_wifi_component->is_disabled()) esp_wifi_stop();   // radio off again
                }
                global_preferences->sync();
            - text_sensor.template.publish:
                id: hub_state
                state: !lambda |-
                  char b[64];
                  snprintf(b, sizeof(b), "%s, %d dBm, ch %u, %u waiting", pnet::P.result, id(g_hub_rssi),
                           id(g_hub_ch), (unsigned) id(g_unsent));
                  return std::string(b);

  # ---------------------------------------------------------------- radios
  - id: radio_wifi
    then:
      - wifi.enable:
      - lambda: |-
          if (!id(mqtt_host).state.empty()) {
            id(mqtt_client).set_broker_address(id(mqtt_host).state);
            id(mqtt_client).set_broker_port((uint16_t) id(mqtt_port).state);
            id(mqtt_client).set_username(id(mqtt_user).state);
            id(mqtt_client).set_password(id(mqtt_pass).state);
            id(mqtt_client).enable();
          }

  - id: ble_on
    then:
      - ble.enable:
      - script.execute: update_status

  # ---------------------------------------------------------------- measuring, logging, reporting
  - id: do_measure
    then:
      - lambda: |-
          // battery: divider on, 4 samples
          id(div_en).turn_on();                    // DIV_EN low: divider conducts
          delay(30);
          float vb = 0;
          for (int i = 0; i < 4; i++) vb += id(vbat_adc).sample();
          vb = vb / 4.0f * 2.0f;
          id(div_en).turn_off();                   // DIV_EN off: no divider current
          if (std::isnan(vb) || vb < 1.0f) ESP_LOGW("measure", "battery ADC returned %.3f V – ADC not ready?", vb);
          id(g_vbat) = vb;
          // probe: square wave (default 1 MHz, 40 % duty: keeps the dry end inside the ADC's accurate
          // range of ~2.5 V), wait for the peak detector to settle (simulated: < 25 ms), 32 samples
          float fk = id(probe_freq).state, du = id(probe_duty).state;
          if (std::isnan(fk) || fk < 100.0f) fk = 1000.0f;
          if (std::isnan(du) || du < 10.0f || du > 60.0f) du = 40.0f;
          id(probe_drv).update_frequency(fk * 1000.0f);
          id(probe_drv).set_level(du / 100.0f);
          float st = id(settle_ms).state;
          if (std::isnan(st) || st < 20.0f) st = 100.0f;
          delay((uint32_t) st);
          float s[32];
          for (int i = 0; i < 32; i++) { s[i] = id(moist_adc).sample(); delay(3); }
          id(probe_drv).set_level(0.0f);
          std::sort(s, s + 32);
          float sum = 0, sq = 0;
          for (int i = 4; i < 28; i++) sum += s[i];   // trimmed mean: drop 4 lowest + 4 highest
          float mean = sum / 24.0f;
          for (int i = 4; i < 28; i++) sq += (s[i] - mean) * (s[i] - mean);
          // the drive swing equals the battery voltage: scale to a fixed 3.30 V
          float k = 3.30f / std::max(2.5f, vb);
          float v = mean * k;
          id(g_raw) = v;
          id(g_spread) = sqrtf(sq / 24.0f) * k;       // noise of this reading (V)
          float dry = std::isnan(id(cal_dry).state) ? 2.30f : id(cal_dry).state;
          float wet = std::isnan(id(cal_wet).state) ? 1.30f : id(cal_wet).state;
          float m = (fabsf(dry - wet) < 0.01f) ? 0.0f : (dry - v) / (dry - wet) * 100.0f;
          id(g_moist) = std::max(0.0f, std::min(100.0f, m));

  - id: log_reading                # store this wake's reading once (after a possible clock sync)
    then:
      - lambda: |-
          if (id(g_logged)) return;
          plog::Rec r;
          r.t = pnet::now_s();             // below 1.7e9 = seconds since start (clock not set yet)
          r.moist10 = (uint16_t) lroundf(id(g_moist) * 10.0f);
          r.vbat_mv = (uint16_t) lroundf(id(g_vbat) * 1000.0f);
          plog::append(r);
          id(g_logged) = true;
          if (id(g_unsent) < plog::capacity()) id(g_unsent) += 1;   // for the hub
      - component.update: log_count
      - script.execute: update_status

  - id: publish_all
    then:
      - component.update: last_report
      - component.update: soil_moisture
      - component.update: soil_raw
      - component.update: soil_spread
      - component.update: battery_voltage
      - component.update: log_count
      - script.execute: update_status

  - id: send_report                # one retained JSON report, confirmed by its own echo, 3 tries
    then:
      - lambda: "plog::note_result(id(mqtt_client).is_connected() ? 'f' : 'n');"
      - if:
          condition:
            lambda: 'return id(mqtt_client).is_connected();'
          then:
            - lambda: |-
                id(g_seq) += 1;
                id(g_ack) = false;
            - repeat:
                count: 3
                then:
                  - if:
                      condition:
                        lambda: 'return !id(g_ack) && id(mqtt_client).is_connected();'
                      then:
                        - mqtt.publish:
                            topic: !lambda 'return std::string(App.get_name().c_str()) + "/report";'
                            qos: 1
                            retain: true
                            payload: !lambda |-
                              char b[600];
                              time_t now = ::time(nullptr);
                              char ts[24] = "?";
                              if (now > 1700000000) { struct tm tmv; localtime_r(&now, &tmv); strftime(ts, sizeof(ts), "%Y-%m-%d %H:%M:%S", &tmv); }
                              snprintf(b, sizeof(b),
                                       "{\"seq\":%u,\"time\":\"%s\",\"t\":%u,\"moisture\":%.1f,\"raw\":%.3f,\"battery\":%.2f,\"spread\":%.3f,\"log\":%u,\"failed\":%u,\"wakes\":%u,\"boots\":\"%s\",\"fw\":\"${fw_version}\"}",
                                       (unsigned) id(g_seq), ts, (unsigned) plog::now_or_zero(), id(g_moist), id(g_raw),
                                       id(g_vbat), id(g_spread), (unsigned) plog::size(), (unsigned) id(g_report_fail),
                                       (unsigned) plog::rtc_wakes, plog::boot_history().c_str());
                              return std::string(b);
                        - wait_until:
                            condition:
                              lambda: 'return id(g_ack);'
                            timeout: 4s
            - if:
                condition:
                  lambda: 'return !id(g_ack);'
                then:
                  - lambda: 'id(g_report_fail) += 1;'
                  - logger.log:
                      level: WARN
                      format: "Report %u NOT confirmed by the broker"
                      args: ['(unsigned) id(g_seq)']
                else:
                  - lambda: "plog::note_result('r');"
                  - logger.log:
                      format: "Report %u confirmed by the broker"
                      args: ['(unsigned) id(g_seq)']
            - component.update: report_fail_sensor

  - id: read_extra                 # extended in plant_sensor_universal_env.yaml
    then:
      - delay: 1ms

  - id: update_status              # Bluetooth status text for the phone page
    then:
      - if:
          condition: ble.enabled
          then:
            - ble_server.characteristic.set_value:
                id: ch_status
                value: !lambda |-
                  char b[512];
                  snprintf(b, sizeof(b),
                           "m=%.1f;raw=%.3f;vb=%.2f;dry=%.3f;wet=%.3f;n=%u;cap=%u;t=%u;svc=%d;li=%d;re=%d;st=%d;"
                           "wc=%d;mc=%d;mh=%s;mp=%d;mu=%s;wu=%s;fw=${fw_version};hub=%s;bh=%s;name=%s",
                           id(g_moist), id(g_raw), id(g_vbat), id(cal_dry).state, id(cal_wet).state,
                           (unsigned) plog::size(), (unsigned) plog::capacity(), (unsigned) plog::now_or_zero(),
                           id(g_service) ? 1 : 0, (int) id(log_interval).state, (int) id(report_every).state,
                           (int) id(service_timeout).state, id(wifi_comp).is_connected() ? 1 : 0,
                           id(mqtt_client).is_connected() ? 1 : 0, id(mqtt_host).state.c_str(),
                           (int) id(mqtt_port).state, id(mqtt_user).state.c_str(), id(web_user).state.c_str(),
                           id(hub_state).state.c_str(), plog::boot_history().substr(0, 110).c_str(), App.get_name().c_str());
                  std::string s(b);
                  return std::vector<uint8_t>(s.begin(), s.end());

  - id: ble_cmd                    # phone commands that need actions
    then:
      - if:
          condition:
            lambda: 'return id(g_cmd) == 1;'
          then:
            - number.set:
                id: cal_dry
                value: !lambda 'return id(g_raw);'
      - if:
          condition:
            lambda: 'return id(g_cmd) == 2;'
          then:
            - number.set:
                id: cal_wet
                value: !lambda 'return id(g_raw);'
      - if:
          condition:
            lambda: 'return id(g_cmd) == 3;'
          then:
            - script.execute: do_measure
            - script.execute: publish_all
      - if:                        # new WiFi / MQTT settings from the phone: restart to use them
          condition:
            lambda: 'return id(g_cmd) == 10;'
          then:
            - lambda: 'global_preferences->sync();'
            - delay: 1500ms
            - lambda: 'App.safe_reboot();'
      - if:
          condition:
            lambda: 'return id(g_cmd) == 11;'
          then:
            - lambda: 'id(g_cmd) = 0;'
            - delay: 1s
            - script.execute: power_off
      - lambda: 'id(g_cmd) = 0;'
      - if:                        # the phone set the clock: store the pending reading now
          condition:
            lambda: 'return !id(g_logged) && plog::now_or_zero() != 0;'
          then:
            - script.execute: log_reading
      - script.execute: update_status

  # ---------------------------------------------------------------- service mode
  - id: service_on
    then:
      - lambda: |-
          id(g_service) = true;
          id(g_service_t0) = millis();
      - deep_sleep.prevent: sleeper
      - switch.template.publish:
          id: service_switch
          state: ON
      - script.execute: radio_wifi
      - if:                        # first setup: WiFi only (its own setup network + Bluetooth on
          condition:               # the same radio make phones fail to join)
            lambda: 'return id(g_setup_done);'
          then:
            - script.execute: ble_on
      - script.stop: show_code
      - repeat:                    # 3 fast flashes = service mode on
          count: 3
          then:
            - output.turn_on: status_led
            - delay: 120ms
            - output.turn_off: status_led
            - delay: 120ms
      - logger.log: "Service mode ON"

  - id: service_off
    then:
      - lambda: |-
          id(g_service) = false;
          id(g_setup_done) = true;
      - switch.template.publish:
          id: service_switch
          state: OFF
      - script.execute: log_reading
      - script.stop: show_code
      - output.turn_on: status_led # one long flash = normal mode
      - delay: 1500ms
      - output.turn_off: status_led
      - logger.log: "Service mode OFF - going to sleep"
      - lambda: 'global_preferences->sync();'
      - delay: 500ms
      - deep_sleep.allow: sleeper
      - script.execute: go_to_sleep

  - id: go_to_sleep
    then:
      - lambda: |-
          float m = id(log_interval).state;
          if (std::isnan(m) || m < 10.0f || m > 360.0f) m = 60.0f;
          bool low = id(g_vbat) > 0.5f && id(g_vbat) < 3.0f;
          plog::note_sleep(low ? 360 : (uint16_t) m);
          ESP_LOGI("sleep", "battery %.2f V -> sleeping %u min%s", id(g_vbat), low ? 360u : (unsigned) m,
                   low ? " (battery low)" : "");
          plog::hold_straps();
      - if:
          condition:
            lambda: 'return id(g_vbat) > 0.5f && id(g_vbat) < 3.0f;'
          then:
            - deep_sleep.enter:
                id: sleeper
                sleep_duration: 6h   # battery low: log only every 6 h
          else:
            - deep_sleep.enter:
                id: sleeper
                sleep_duration: !lambda |-
                  float m = id(log_interval).state;
                  if (std::isnan(m) || m < 10.0f || m > 360.0f) m = 60.0f;
                  return (uint32_t) (m * 60000.0f);

  # ---------------------------------------------------------------- BOOT button
  - id: btn_hold
    mode: restart
    then:
      - delay: 2s
      - if:
          condition:
            binary_sensor.is_on: boot_button
          then:
            - lambda: 'id(g_btn_stage) = 1;'
            - output.turn_off: status_led    # LED off + one blink: release now = service toggle
            - delay: 300ms
            - output.turn_on: status_led
            - delay: 150ms
            - output.turn_off: status_led
            - delay: 2550ms                  # 5 s held
            - if:
                condition:
                  binary_sensor.is_on: boot_button
                then:
                  - lambda: 'id(g_btn_stage) = 3;'
                  - repeat:                  # two blinks: release now = POWER OFF
                      count: 2
                      then:
                        - output.turn_on: status_led
                        - delay: 150ms
                        - output.turn_off: status_led
                        - delay: 200ms
                  - delay: 4300ms            # 10 s held
                  - if:
                      condition:
                        binary_sensor.is_on: boot_button
                      then:
                        - lambda: 'id(g_btn_stage) = 2;'
                        - script.execute: network_reset

  - id: power_off                # deep sleep without a timer: only RST wakes it, into service mode
    then:
      - logger.log: "POWER OFF - press RST to start (in service mode)"
      - lambda: |-
          id(g_service) = false;
          id(g_start_service) = true;
      - script.execute: log_reading
      - repeat:                    # three slow blinks = off
          count: 3
          then:
            - output.turn_on: status_led
            - delay: 500ms
            - output.turn_off: status_led
            - delay: 400ms
      - lambda: 'global_preferences->sync();'
      - delay: 300ms
      - lambda: |-
          plog::note_result('o');
          plog::hist_save();
          App.run_safe_shutdown_hooks();
          plog::hold_straps();
          esp_sleep_disable_wakeup_source(ESP_SLEEP_WAKEUP_ALL);
          esp_deep_sleep_start();

  - id: network_reset
    then:
      - logger.log: "NETWORK RESET: WiFi + MQTT settings erased, calibration and log kept"
      - repeat:                    # fast blinking = reset
          count: 15
          then:
            - output.turn_on: status_led
            - delay: 60ms
            - output.turn_off: status_led
            - delay: 60ms
      - lambda: |-
          id(wifi_comp).save_wifi_sta("", "");
          id(g_setup_done) = false;
          id(g_wifi_ok) = false;
      - text.set:
          id: mqtt_host
          value: ""
      - text.set:
          id: mqtt_user
          value: ""
      - text.set:
          id: mqtt_pass
          value: ""
      - lambda: 'global_preferences->sync();'
      - delay: 500ms
      - lambda: 'App.safe_reboot();'

  # ---------------------------------------------------------------- moisture blink code
  - id: show_code
    then:
      - lambda: 'id(t0) = millis();'
      - if:                        # low battery: one long glow first
          condition:
            lambda: 'return id(g_vbat) < 3.1f;'
          then:
            - output.turn_on: status_led
            - delay: 1500ms
            - output.turn_off: status_led
            - delay: 600ms
      - while:                     # blink ~6 s: 600 ms on/off when dry ... 75 ms when wet
          condition:
            lambda: 'return millis() - id(t0) < 6000;'
          then:
            - output.turn_on: status_led
            - delay: !lambda 'return (uint32_t) (600.0f - id(g_moist) * 5.25f);'
            - output.turn_off: status_led
            - delay: !lambda 'return (uint32_t) (600.0f - id(g_moist) * 5.25f);'
